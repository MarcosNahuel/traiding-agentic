[project]
name = "asesor-iol"
version = "0.1.0"
description = "Agente asesor de inversiones sobre InvertirOnline (IOL) — human-in-the-loop via Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
asesor-iol = "asesor_iol.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asesor_iol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
